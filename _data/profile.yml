short_bio: >-
  <p>Hi! I'm a PhD student at the <a href="https://lti.cs.cmu.edu/">Language Technologies Institute</a>,
  Carnegie Mellon University, fortunate to be advised by
  <a href="https://www.cs.cmu.edu/~dmortens/">Prof. David Mortensen</a> and
  <a href="https://sites.google.com/view/shinjiwatanabe/">Prof. Shinji Watanabe</a>.
  My research focuses on self-supervised learning and spoken language processing.
  I'm especially interested in using speech to learn world knowledge.
  This summer, I am a Research Scientist Intern at Meta Reality Labs.</p>

  <p>Previously, I was a pre-doctoral researcher at Google DeepMind, working on low-resource language
  capabilities for <a href="https://arxiv.org/abs/2507.06261">Gemini</a> with
  <a href="https://parthatalukdar.github.io">Dr. Partha Talukdar</a>,
  <a href="https://ee.iisc.ac.in/sriram-ganapathy/">Dr. Sriram Ganapathy</a> and
  <a href="https://scholar.google.co.in/citations?user=gXW8J2wAAAAJ&hl=en">Dr. Shikhar Vashishth</a>.</p>

  <p>Besides my research, I find joy in playing snooker and freestyle football (soccer).
  I'm always open to collaborations, feel free to reach out!</p>

